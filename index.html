<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2342"><meta name="apple-mobile-web-app-capable" content="yes"><title>KOKS TOOLBOX</title><link rel="icon" href="logo.svg?v=6"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#07162b,#0b2342 48%,#102f54);color:#eef4ff}.wrap{max-width:1100px;margin:auto;padding:18px 16px 42px}.brand{display:flex;align-items:center;justify-content:center;gap:12px;color:#f3e5cf;text-decoration:none;margin-bottom:20px}.brand img{width:76px;height:44px}.brand span{font:900 24px Georgia;letter-spacing:2px}.brand small{display:block;color:#dcb56f;font-size:10px;letter-spacing:3px}.home{min-height:75vh;display:flex;justify-content:center;padding-top:10vh}.menu{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}.tool{padding:30px 48px;border:1px solid #7fa3c955;border-radius:18px;background:linear-gradient(145deg,#173b63,#0d2949);color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 12px 30px #0007}section{max-width:900px;margin:auto;background:linear-gradient(145deg,#f2e7d7,#e7d6c0);color:#2d2924;border:1px solid #d4bfa5;border-radius:22px;padding:22px;box-shadow:0 14px 35px #0006}h1{margin-top:4px}button{cursor:pointer}.back,.secondary,.primary,.danger{border:0;border-radius:11px;padding:10px 14px;font-weight:800}.back,.secondary{background:#ddc7a8;color:#2d2924}.primary{background:#173b63;color:#fff}.danger{background:#a83c32;color:#fff}.hidden{display:none!important}input,select,textarea{width:100%;padding:12px;border:1px solid #cdbb9f;border-radius:11px;background:#fbf6ee;color:#2d2924;font:inherit}textarea{min-height:120px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.folders{display:flex!important;flex-direction:column!important;gap:8px}.folder,.recipe-title{width:100%;display:block;text-align:left;border:1px solid #cdbb9f;border-radius:13px;background:#fbf6ee;color:#2d2924;padding:14px;font-weight:800;font-size:16px}.recipe-row{display:flex;gap:8px;align-items:center;margin-top:9px}.recipe-row .recipe-title{margin:0;flex:1}.check{width:22px;height:22px;flex:0 0 22px;accent-color:#173b63}.card{padding:16px;border-radius:16px;background:#e5d2b9;margin-top:12px}.card p{white-space:pre-wrap}.meta,.crumb{color:#756a5c;font-size:14px}.folder-head{display:flex;align-items:center;gap:12px;margin-bottom:15px}.form-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.move{display:flex;gap:8px;align-items:end;margin-top:14px}.move>div{flex:1}@media(max-width:700px){.tool{width:90vw}.move{flex-direction:column;align-items:stretch}}
</style></head><body><div class="wrap"><a class="brand" href="#" onclick="show('home');return false"><img src="logo.svg?v=6"><div><span>KOKS</span><small>TOOLBOX</small></div></a><div id="home" class="home"><div class="menu"><button class="tool" onclick="show('sousvide')">🥩 Sous-vide</button><button class="tool" onclick="show('recipes')">📖 Mijn recepten</button><button class="tool" onclick="show('shopping')">🛒 Boodschappen</button></div></div><section id="sousvide" class="hidden"><button class="back" onclick="show('home')">← Menu</button><h1>🥩 Sous-vide Calculator</h1><label>Soort biefstuk</label><input id="type" placeholder="Bijv. ribeye"><label>Dikte (cm)</label><input id="thickness" type="number" min="0.5" step="0.1"><label>Gaarheid</label><select id="doneness"><option value="rare">Rare</option><option value="mr">Medium rare</option><option value="medium">Medium</option><option value="mw">Medium well</option><option value="well">Well done</option></select><button class="primary" onclick="calculate()">Bereken</button><div id="svresult" class="card hidden"><b id="temp"></b><div id="time"></div></div></section><section id="recipes" class="hidden"><button class="back" onclick="show('home')">← Menu</button><div id="root"><div class="actions"><input id="folderName" placeholder="Nieuwe map"><button class="secondary" onclick="addFolder()">➕ Map</button><button class="primary" onclick="newRecipe()">➕ Recept</button></div><input id="search" placeholder="Zoeken..." oninput="renderRoot()"><div id="folders" class="folders"></div></div><div id="folderView" class="hidden"></div><div id="recipeDetail" class="hidden"></div><div id="form" class="hidden"></div></section><section id="shopping" class="hidden"><button class="back" onclick="show('home')">← Menu</button><h1>🛒 Boodschappenlijst</h1><p class="crumb">Vink in je recepten aan welke recepten je wilt meenemen. Alleen de ingrediënten worden toegevoegd, nooit de bereidingswijze.</p><div id="shopList" class="card"></div><div class="actions"><button class="primary" onclick="buildShopping()">🛒 Maak boodschappenlijst</button><button class="secondary" onclick="clearShopping()">Wissen</button></div><div id="shoppingResult" class="card hidden"></div></section></div><script>const temps={rare:52,mr:55,medium:58,mw:62,well:66};let recipes=JSON.parse(localStorage.getItem('recipes')||'[]'),folders=JSON.parse(localStorage.getItem('folders')||'["Algemeen"]'),selected=new Set(JSON.parse(localStorage.getItem('shoppingRecipes')||'[]')),active=null,edit=null;const $=x=>document.getElementById(x);const saveData=()=>{localStorage.setItem('recipes',JSON.stringify(recipes));localStorage.setItem('folders',JSON.stringify(folders));localStorage.setItem('shoppingRecipes',JSON.stringify([...selected]))};recipes=recipes.map(r=>({...r,folder:folders.includes(r.folder)?r.folder:folders[0]}));function show(id){['home','sousvide','recipes','shopping'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='recipes')renderRoot();if(id==='shopping')renderShopChoices();scrollTo(0,0)}function calculate(){let t=parseFloat($('thickness').value);if(!t)return alert('Vul de dikte in.');let m=t<=2?60:t<=2.5?75:t<=3?90:t<=3.5?105:t<=4?120:t<=5?180:t<=6?210:270;$('temp').textContent=temps[$('doneness').value]+' °C';$('time').textContent=Math.floor(m/60)+' uur '+m%60+' min';$('svresult').classList.remove('hidden')}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function opts(v){return folders.map(f=>'<option '+(f===v?'selected':'')+'>'+esc(f)+'</option>').join('')}function renderRoot(){active=null;$('root').classList.remove('hidden');$('folderView').classList.add('hidden');$('recipeDetail').classList.add('hidden');$('form').classList.add('hidden');let q=($('search').value||'').toLowerCase();$('folders').innerHTML=folders.filter(f=>!q||f.toLowerCase().includes(q)).map(f=>'<button class="folder" onclick="openFolder('+JSON.stringify(f)+')">📁 '+esc(f)+'</button>').join('')||'<p>Geen mappen.</p>'}function openFolder(f){active=f;$('root').classList.add('hidden');$('folderView').classList.remove('hidden');renderFolder()}function renderFolder(){let rs=recipes.filter(r=>r.folder===active);$('folderView').innerHTML='<div class="folder-head"><button class="back" onclick="renderRoot()">← Terug</button><div><h1>📁 '+esc(active)+'</h1><div class="crumb">Mijn recepten</div></div></div><div class="actions"><button class="primary" onclick="newRecipe()">➕ Recept</button><button class="secondary" onclick="renameFolder()">✏️ Map hernoemen</button><button class="danger" onclick="deleteFolder()">🗑️ Map verwijderen</button></div>'+(rs.map(r=>'<div class="recipe-row"><input class="check" type="checkbox" '+(selected.has(r.id)?'checked':'')+' onchange="toggleRecipe('+r.id+',this.checked)"><button class="recipe-title" onclick="openRecipe('+r.id+')">📖 '+esc(r.name)+'</button></div>').join('')||'<p>Geen recepten in deze map.</p>')}function openRecipe(id){let r=recipes.find(x=>x.id===id);if(!r)return;$('folderView').classList.add('hidden');$('recipeDetail').classList.remove('hidden');$('recipeDetail').innerHTML='<button class="back" onclick="renderFolder()">← Terug naar '+esc(r.folder)+'</button><div class="card"><h2>'+esc(r.name)+'</h2><div class="meta">'+(r.unit==='grams'?'⚖️ '+esc(r.amount)+' gram':'👥 '+esc(r.amount)+' personen')+'</div><h4>🥕 Ingrediënten</h4><p>'+esc(r.ingredients)+'</p><h4>👨‍🍳 Bereiding</h4><p>'+esc(r.preparation)+'</p><div class="move"><div><label>📁 Map</label><select id="moveFolder">'+opts(r.folder)+'</select></div><button class="secondary" onclick="moveRecipe('+id+')">↔️ Verplaatsen</button></div><div class="actions"><button class="secondary" onclick="editRecipe('+id+')">✏️ Aanpassen</button><button class="danger" onclick="removeRecipe('+id+')">🗑️ Verwijderen</button></div></div>'}function newRecipe(){edit=null;$('root').classList.add('hidden');$('folderView').classList.add('hidden');$('recipeDetail').classList.add('hidden');$('form').classList.remove('hidden');$('form').innerHTML='<h1>➕ Recept toevoegen</h1><label>Receptnaam</label><input id="name"><label>Map</label><select id="recipeFolder">'+opts(active||folders[0])+'</select><label>Gebruik</label><select id="unit"><option value="persons">👥 Personen</option><option value="grams">⚖️ Gram</option></select><label>Aantal personen / gram</label><input id="amount" type="number" min="1"><label>🥕 Ingrediënten</label><textarea id="ingredients" placeholder="Ingrediënt 1&#10;Ingrediënt 2"></textarea><label>👨‍🍳 Bereiding</label><textarea id="preparation"></textarea><div class="form-actions"><button class="primary" onclick="saveRecipe()">💾 Opslaan</button><button class="secondary" onclick="cancelForm()">Annuleren</button></div>'}function editRecipe(id){let r=recipes.find(x=>x.id===id);edit=id;newRecipe();$('name').value=r.name;$('recipeFolder').value=r.folder;$('unit').value=r.unit;$('amount').value=r.amount;$('ingredients').value=r.ingredients;$('preparation').value=r.preparation}function saveRecipe(){let name=$('name').value.trim();if(!name)return alert('Vul een receptnaam in.');let r={id:edit||Date.now(),name,folder:$('recipeFolder').value,unit:$('unit').value,amount:$('amount').value,ingredients:$('ingredients').value,preparation:$('preparation').value};if(edit)recipes=recipes.map(x=>x.id===edit?r:x);else recipes.push(r);saveData();active=r.folder;edit=null;cancelForm()}function cancelForm(){$('form').classList.add('hidden');if(active){$('folderView').classList.remove('hidden');renderFolder()}else{$('root').classList.remove('hidden');renderRoot()}}function moveRecipe(id){let r=recipes.find(x=>x.id===id);r.folder=$('moveFolder').value;saveData();active=r.folder;renderFolder();$('recipeDetail').classList.add('hidden');$('folderView').classList.remove('hidden')}function removeRecipe(id){if(!confirm('Dit recept verwijderen?'))return;recipes=recipes.filter(r=>r.id!==id);selected.delete(id);saveData();renderFolder()}function addFolder(){let n=prompt('Naam van de nieuwe map:');if(!n||folders.includes(n.trim()))return;folders.push(n.trim());saveData();renderRoot()}function renameFolder(){let n=prompt('Nieuwe naam:',active);if(!n||folders.includes(n.trim()))return;n=n.trim();recipes.forEach(r=>{if(r.folder===active)r.folder=n});folders=folders.map(f=>f===active?n:f);active=n;saveData();renderFolder()}function deleteFolder(){if(folders.length===1)return alert('Er moet minimaal één map blijven.');if(!confirm('Deze map en de recepten erin verwijderen?'))return;recipes=recipes.filter(r=>r.folder!==active);folders=folders.filter(f=>f!==active);saveData();renderRoot()}function toggleRecipe(id,on){if(on)selected.add(id);else selected.delete(id);saveData()}function renderShopChoices(){let by={};recipes.forEach(r=>(by[r.folder]??=[]).push(r));$('shopList').innerHTML=Object.keys(by).map(f=>'<h3>📁 '+esc(f)+'</h3>'+by[f].map(r=>'<label style="display:flex;gap:10px;align-items:center;margin:9px 0"><input class="check" type="checkbox" '+(selected.has(r.id)?'checked':'')+' onchange="toggleRecipe('+r.id+',this.checked)"><span>'+esc(r.name)+'</span></label>').join('')).join('')||'<p>Voeg eerst recepten toe.</p>'}function buildShopping(){let chosen=recipes.filter(r=>selected.has(r.id));let lines=[];chosen.forEach(r=>{if(r.ingredients.trim())lines.push('• '+r.name+':\n'+r.ingredients.trim())});$('shoppingResult').innerHTML='<h2>🛒 Boodschappen</h2>'+(lines.length?'<p>'+esc(lines.join('\n\n'))+'</p>':'<p>Vink eerst één of meer recepten aan.</p>');$('shoppingResult').classList.remove('hidden')}function clearShopping(){selected.clear();saveData();renderShopChoices();$('shoppingResult').classList.add('hidden')}</script></body></html>
