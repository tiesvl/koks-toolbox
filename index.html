<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOKS TOOLBOX</title><link rel="icon" href="logo.svg?v=8"><script src="https://alcdn.msauth.net/browser/2.39.0/js/msal-browser.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#07162b,#0b2342 48%,#102f54);color:#fff}.wrap{max-width:1100px;margin:auto;padding:18px 16px}.brand{display:block;text-align:center;color:#f3e5cf;text-decoration:none;margin-bottom:20px}.brand span{font:900 24px Georgia;letter-spacing:2px}.brand small{display:block;color:#dcb56f;font-size:10px;letter-spacing:3px}.home{min-height:75vh;display:flex;justify-content:center;padding-top:10vh}.menu{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}.tool{padding:30px 48px;border:1px solid #7fa3c955;border-radius:18px;background:linear-gradient(145deg,#173b63,#0d2949);color:#fff;font-size:18px;font-weight:800;cursor:pointer}.hidden{display:none!important}section{max-width:900px;margin:auto;background:linear-gradient(145deg,#f2e7d7,#e7d6c0);color:#2d2924;border-radius:22px;padding:22px}.back,.secondary,.primary,.danger{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.back,.secondary{background:#ddc7a8;color:#2d2924}.primary{background:#173b63;color:#fff}.danger{background:#a83c32;color:#fff}.folders{display:flex;flex-direction:column;gap:8px}.folder,.recipe-title{width:100%;display:block;text-align:left;border:1px solid #cdbb9f;border-radius:13px;background:#fbf6ee;color:#2d2924;padding:14px;font-weight:800;font-size:16px;cursor:pointer}.recipe-row{display:flex;gap:8px;align-items:center;margin-top:9px}.recipe-row .recipe-title{margin:0;flex:1}.card{padding:16px;border-radius:16px;background:#e5d2b9;margin-top:12px}.card p{white-space:pre-wrap}.folder-head{display:flex;align-items:center;gap:12px;margin-bottom:15px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions input{flex:1}input,select,textarea{width:100%;padding:12px;border:1px solid #cdbb9f;border-radius:11px;background:#fbf6ee;color:#2d2924;font:inherit}.status{padding:12px;border-radius:12px;background:#fbf6ee;margin:12px 0}.recipe-body h4{margin-bottom:6px}.recipe-body p{margin-top:0}.muted{opacity:.75}@media(max-width:700px){.tool{width:90vw}}</style></head><body><div class="wrap"><a class="brand" href="#" id="brand"><span>KOKS</span><small>TOOLBOX</small></a><div id="home" class="home"><div class="menu"><button class="tool" data-show="sousvide">🥩 Sous-vide</button><button class="tool" data-show="recipes">📖 Mijn recepten</button></div></div><section id="sousvide" class="hidden"><button class="back" data-show="home">← Menu</button><h1>🥩 Sous-vide Calculator</h1><label>Soort biefstuk</label><input id="type" placeholder="Bijv. ribeye"><label>Dikte (cm)</label><input id="thickness" type="number" min="0.5" step="0.1"><label>Gaarheid</label><select id="doneness"><option value="rare">Rare</option><option value="mr">Medium rare</option><option value="medium">Medium</option><option value="mw">Medium well</option><option value="well">Well done</option></select><button class="primary" id="calc">Bereken</button><div id="svresult" class="card hidden"><b id="temp"></b><div id="time"></div></div></section><section id="recipes" class="hidden"><button class="back" data-show="home">← Menu</button><div id="recipeRoot"><h1>📖 Mijn recepten</h1><div class="card"><h3>☁️ OneDrive</h3><p class="muted">Je Word-recepten blijven in OneDrive. De webapp leest ze daar rechtstreeks uit.</p><div class="actions"><button class="primary" id="login">Aanmelden met Microsoft</button><button class="secondary hidden" id="logout">Afmelden</button></div><label>Client ID van je Microsoft-app</label><input id="clientId" placeholder="bijv. 12345678-...."><button class="secondary" id="saveClient">Opslaan</button><div id="status" class="status">Nog niet verbonden.</div></div><div id="driveBrowser" class="hidden"><div class="folder-head"><button class="back" id="driveBack">← Terug</button><h2 id="driveTitle">OneDrive</h2></div><div class="actions"><button class="primary" id="refresh">↻ Vernieuwen</button><button class="secondary" id="chooseRoot">Deze map gebruiken</button></div><div id="driveItems" class="folders"></div></div></div><div id="recipeFolderView" class="hidden"></div><div id="recipeDetail" class="hidden"></div></section></div><script>const $=id=>document.getElementById(id);const temps={rare:52,mr:55,medium:58,mw:62,well:66};const MS_SCOPES=['Files.Read'];let msalApp=null,account=null,drivePath=[],currentItems=[],recipeRoot=null;function show(id){['home','sousvide','recipes'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='recipes')initRecipes();window.scrollTo(0,0)}function setStatus(t){$('status').textContent=t}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function getClientId(){return localStorage.getItem('msClientId')||$('clientId').value.trim()}function makeMsal(){const id=getClientId();if(!id)throw Error('Vul eerst de Client ID in.');msalApp=new msal.PublicClientApplication({auth:{clientId:id,authority:'https://login.microsoftonline.com/common',redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}})}async function initRecipes(){const id=localStorage.getItem('msClientId');if(id)$('clientId').value=id;try{if(!id){setStatus('Vul je Microsoft Client ID in en klik op Opslaan.');return}makeMsal();const res=await msalApp.handleRedirectPromise();if(res){account=res.account;msalApp.setActiveAccount(account)}else{const ac=msalApp.getAllAccounts();if(ac.length){account=ac[0];msalApp.setActiveAccount(account)}}if(account){$('login').classList.add('hidden');$('logout').classList.remove('hidden');setStatus('Verbonden met OneDrive als '+(account.username||''));await openDriveRoot()}else setStatus('Nog niet aangemeld bij OneDrive.')}catch(e){setStatus(e.message)}}async function login(){try{if(!msalApp)makeMsal();await msalApp.loginRedirect({scopes:MS_SCOPES})}catch(e){setStatus(e.message)}}async function token(){const r={scopes:MS_SCOPES,account};try{return(await msalApp.acquireTokenSilent(r)).accessToken}catch(e){await msalApp.acquireTokenRedirect(r);throw e}}async function graph(url,opts={}){const access=await token();const r=await fetch('https://graph.microsoft.com/v1.0'+url,{...opts,headers:{Authorization:'Bearer '+access,...(opts.headers||{})}});if(!r.ok)throw Error('OneDrive gaf '+r.status+' terug. Controleer de Microsoft-toestemming.');return r}async function openDriveRoot(){drivePath=[];recipeRoot=null;$('driveBrowser').classList.remove('hidden');$('recipeFolderView').classList.add('hidden');await browse('/me/drive/root/children','OneDrive')}async function browse(url,title){$('driveTitle').textContent=title;$('driveItems').innerHTML='<p>Bezig met laden…</p>';const r=await graph(url);const data=await r.json();currentItems=data.value||[];$('driveItems').innerHTML='';currentItems.sort((a,b)=>((a.folder?-1:1)-(b.folder?-1:1))||a.name.localeCompare(b.name,'nl')).forEach(item=>{const b=document.createElement('button');b.className='folder';b.textContent=(item.folder?'📁 ':'📄 ')+item.name;b.onclick=()=>item.folder?enterFolder(item):openDoc(item);$('driveItems').append(b)});if(!currentItems.length)$('driveItems').innerHTML='<p>Deze map is leeg.</p>'}async function enterFolder(item){drivePath.push({id:item.id,name:item.name,parent:currentItems});await browse('/me/drive/items/'+item.id+'/children',item.name)}function parentDrive(){if(!drivePath.length)return;drivePath.pop();if(!drivePath.length)return openDriveRoot();const p=drivePath[drivePath.length-1];browse('/me/drive/items/'+p.id+'/children',p.name)}function chooseCurrent(){if(!currentItems)return;recipeRoot={id:drivePath.length?drivePath[drivePath.length-1].id:'root',name:$('driveTitle').textContent};setStatus('Receptenmap gekozen: '+recipeRoot.name);renderRecipeFolder(recipeRoot.id,recipeRoot.name)}async function renderRecipeFolder(id,name){$('driveBrowser').classList.add('hidden');$('recipeFolderView').classList.remove('hidden');$('recipeDetail').classList.add('hidden');$('recipeFolderView').innerHTML='<button class="back" id="folderBack">← OneDrive</button><h1>📁 '+esc(name)+'</h1><div id="folderItems" class="folders"><p>Bezig met laden…</p></div>';$('folderBack').onclick=()=>{$('recipeFolderView').classList.add('hidden');$('driveBrowser').classList.remove('hidden')};const r=await graph(id==='root'?'/me/drive/root/children':'/me/drive/items/'+id+'/children');const d=await r.json();const box=$('folderItems');box.innerHTML='';(d.value||[]).sort((a,b)=>a.name.localeCompare(b.name,'nl')).forEach(item=>{const b=document.createElement('button');b.className='folder';b.textContent=(item.folder?'📁 ':'📖 ')+item.name;b.onclick=()=>item.folder?renderRecipeFolder(item.id,item.name):openDoc(item);box.append(b)});if(!box.children.length)box.innerHTML='<p>Geen mappen of recepten gevonden.</p>'}async function openDoc(item){if(!/\.docx?$/i.test(item.name)){setStatus('Alleen Word-bestanden (.docx/.doc) worden als recept gelezen.');return}try{setStatus('Recept laden: '+item.name);const r=await graph('/me/drive/items/'+item.id+'/content');const buf=await r.arrayBuffer();let text='';if(/\.docx$/i.test(item.name)){const out=await mammoth.extractRawText({arrayBuffer:buf});text=out.value}else{text='Dit oude .doc-bestand kan niet betrouwbaar in de browser worden uitgelezen. Open het in Word en sla het op als .docx.'}const recipe=parseRecipe(text,item.name.replace(/\.docx?$/i,''));showRecipe(recipe)}catch(e){setStatus(e.message)}}function parseRecipe(text,fallback){const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const lower=lines.map(x=>x.toLowerCase());const ingWords=['ingrediënten','ingredienten','benodigdheden'];const prepWords=['bereiding','bereidingswijze'];let i=lower.findIndex(x=>ingWords.includes(x)||ingWords.some(w=>x.startsWith(w+':')));let p=lower.findIndex((x,n)=>n>(i<0?0:i)&&prepWords.includes(x));if(i<0)i=0;if(p<0)p=lines.length;let title=lines[0]||fallback;if(i===0&&lines.length>1&&!ingWords.includes(lower[0])){title=lines[0];i=1}const ingredients=lines.slice(i+1,p);const preparation=lines.slice(p+1);return{title,ingredients,preparation}}function showRecipe(r){$('driveBrowser').classList.add('hidden');$('recipeFolderView').classList.add('hidden');$('recipeDetail').classList.remove('hidden');$('recipeDetail').innerHTML='<button class="back" id="detailBack">← Terug</button><div class="card recipe-body"><h2>'+esc(r.title)+'</h2><h4>🥕 Ingrediënten</h4><p>'+esc(r.ingredients.join('\n'))+'</p><h4>👨‍🍳 Bereiding</h4><p>'+esc(r.preparation.join('\n'))+'</p></div>';$('detailBack').onclick=()=>{if(recipeRoot)renderRecipeFolder(recipeRoot.id,recipeRoot.name);else openDriveRoot()}}$('saveClient').onclick=()=>{const id=$('clientId').value.trim();if(!id)return alert('Vul de Client ID in.');localStorage.setItem('msClientId',id);location.reload()};$('login').onclick=login;$('logout').onclick=()=>{if(msalApp)msalApp.logoutRedirect()};$('refresh').onclick=()=>browse(drivePath.length?'/me/drive/items/'+drivePath[drivePath.length-1].id+'/children':'/me/drive/root/children',$('driveTitle').textContent);$('driveBack').onclick=parentDrive;$('chooseRoot').onclick=chooseCurrent;$('brand').onclick=e=>{e.preventDefault();show('home')};document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>show(b.dataset.show));$('calc').onclick=()=>{const t=parseFloat($('thickness').value);if(!t)return alert('Vul de dikte in.');const m=t<=2?60:t<=2.5?75:t<=3?90:t<=3.5?105:t<=4?120:t<=5?180:t<=6?210:270;$('temp').textContent=temps[$('doneness').value]+' °C';$('time').textContent=Math.floor(m/60)+' uur '+m%60+' min';$('svresult').classList.remove('hidden')};show('home');</script></body></html>
