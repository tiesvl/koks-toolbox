<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOKS TOOLBOX</title><link rel="icon" href="logo.svg?v=7"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#07162b,#0b2342 48%,#102f54);color:#fff}.wrap{max-width:1100px;margin:auto;padding:18px 16px}.brand{display:block;text-align:center;color:#f3e5cf;text-decoration:none;margin-bottom:20px}.brand span{font:900 24px Georgia;letter-spacing:2px}.brand small{display:block;color:#dcb56f;font-size:10px;letter-spacing:3px}.home{min-height:75vh;display:flex;justify-content:center;padding-top:10vh}.menu{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}.tool{padding:30px 48px;border:1px solid #7fa3c955;border-radius:18px;background:linear-gradient(145deg,#173b63,#0d2949);color:#fff;font-size:18px;font-weight:800;cursor:pointer}.hidden{display:none!important}section{max-width:900px;margin:auto;background:linear-gradient(145deg,#f2e7d7,#e7d6c0);color:#2d2924;border-radius:22px;padding:22px}.back,.secondary,.primary,.danger{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.back,.secondary{background:#ddc7a8;color:#2d2924}.primary{background:#173b63;color:#fff}.danger{background:#a83c32;color:#fff}.folders{display:flex;flex-direction:column;gap:8px}.folder,.recipe-title{width:100%;display:block;text-align:left;border:1px solid #cdbb9f;border-radius:13px;background:#fbf6ee;color:#2d2924;padding:14px;font-weight:800;font-size:16px;cursor:pointer}.recipe-row{display:flex;gap:8px;align-items:center;margin-top:9px}.recipe-row .recipe-title{margin:0;flex:1}.check{width:22px;height:22px;accent-color:#173b63}.card{padding:16px;border-radius:16px;background:#e5d2b9;margin-top:12px}.card p{white-space:pre-wrap}.folder-head{display:flex;align-items:center;gap:12px;margin-bottom:15px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select,textarea{width:100%;padding:12px;border:1px solid #cdbb9f;border-radius:11px;background:#fbf6ee;color:#2d2924;font:inherit}.actions input{width:auto;flex:1}.shopping-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #cdbb9f}.shopping-item span{flex:1}.remove-item{border:0;background:#a83c32;color:#fff;border-radius:8px;padding:6px 9px;font-weight:800;cursor:pointer}@media(max-width:700px){.tool{width:90vw}}</style></head><body><div class="wrap"><a class="brand" href="#" id="brand"><span>KOKS</span><small>TOOLBOX</small></a><div id="home" class="home"><div class="menu"><button class="tool" data-show="sousvide">🥩 Sous-vide</button><button class="tool" data-show="recipes">📖 Mijn recepten</button><button class="tool" data-show="shopping">🛒 Boodschappen</button></div></div><section id="sousvide" class="hidden"><button class="back" data-show="home">← Menu</button><h1>🥩 Sous-vide Calculator</h1><label>Soort biefstuk</label><input id="type" placeholder="Bijv. ribeye"><label>Dikte (cm)</label><input id="thickness" type="number" min="0.5" step="0.1"><label>Gaarheid</label><select id="doneness"><option value="rare">Rare</option><option value="mr">Medium rare</option><option value="medium">Medium</option><option value="mw">Medium well</option><option value="well">Well done</option></select><button class="primary" id="calc">Bereken</button><div id="svresult" class="card hidden"><b id="temp"></b><div id="time"></div></div></section><section id="recipes" class="hidden"><button class="back" data-show="home">← Menu</button><div id="recipeRoot"><h1>📖 Mijn recepten</h1><div class="actions"><input id="folderName" placeholder="Nieuwe map"><button class="secondary" id="addFolder">➕ Map</button><button class="primary" id="addRecipeRoot">➕ Recept</button></div><input id="search" placeholder="Zoeken..."><div id="folders" class="folders"></div></div><div id="recipeFolderView" class="hidden"></div><div id="recipeDetail" class="hidden"></div><div id="recipeForm" class="hidden"></div></section><section id="shopping" class="hidden"><button class="back" data-show="home">← Menu</button><h1>🛒 Boodschappen</h1><button class="primary" id="selectShopping">☑️ Selecteer recepten</button><div id="shoppingMain" class="card"><p>Selecteer recepten uit je mappen om alleen de ingrediënten in je boodschappenlijst te zetten.</p><button class="primary" id="makeList">🛒 Maak boodschappenlijst</button><button class="secondary" id="clearList">Alles wissen</button></div><div id="shopSelect" class="hidden"></div><div id="shoppingResult" class="card hidden"></div></section></div><script>const $=id=>document.getElementById(id);const temps={rare:52,mr:55,medium:58,mw:62,well:66};let recipes=JSON.parse(localStorage.getItem('recipes')||'[]');let folders=JSON.parse(localStorage.getItem('folders')||'["Algemeen"]');let selected=new Set(JSON.parse(localStorage.getItem('shoppingRecipes')||'[]'));let activeFolder=null;let editId=null;function persist(){localStorage.setItem('recipes',JSON.stringify(recipes));localStorage.setItem('folders',JSON.stringify(folders));localStorage.setItem('shoppingRecipes',JSON.stringify([...selected]))}function normalize(){folders=[...new Set(Array.isArray(folders)?folders.filter(Boolean).map(String):[])];if(!folders.length)folders=['Algemeen'];recipes=(Array.isArray(recipes)?recipes:[]).map((r,i)=>({...r,id:r.id??Date.now()+i,folder:folders.includes(r.folder)?r.folder:folders[0]}));selected=new Set([...selected].filter(id=>recipes.some(r=>String(r.id)===String(id))));persist()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(id){['home','sousvide','recipes','shopping'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='recipes')renderRecipeRoot();if(id==='shopping')showShoppingMain();window.scrollTo(0,0)}function renderRecipeRoot(){activeFolder=null;$('recipeRoot').classList.remove('hidden');$('recipeFolderView').classList.add('hidden');$('recipeDetail').classList.add('hidden');$('recipeForm').classList.add('hidden');$('folders').innerHTML=folders.map(f=>{let b=document.createElement('button');return b.outerHTML}).join('');const q=($('search').value||'').toLowerCase();$('folders').innerHTML='';folders.filter(f=>!q||f.toLowerCase().includes(q)).forEach(f=>{const b=document.createElement('button');b.className='folder';b.textContent='📁 '+f;b.dataset.folder=f;$('folders').appendChild(b)});if(!$('folders').children.length)$('folders').innerHTML='<p>Geen mappen.</p>'}function openRecipeFolder(folder){activeFolder=folder;$('recipeRoot').classList.add('hidden');$('recipeFolderView').classList.remove('hidden');$('recipeDetail').classList.add('hidden');$('recipeForm').classList.add('hidden');renderRecipeFolder()}function renderRecipeFolder(){const box=$('recipeFolderView');box.innerHTML='';const head=document.createElement('div');head.className='folder-head';const back=document.createElement('button');back.className='back';back.textContent='← Terug naar mappen';back.onclick=renderRecipeRoot;const title=document.createElement('h1');title.textContent='📁 '+activeFolder;head.append(back,title);box.append(head);const add=document.createElement('button');add.className='primary';add.textContent='➕ Recept';add.onclick=()=>openRecipeForm(null);box.append(add);recipes.filter(r=>r.folder===activeFolder).forEach(r=>{const row=document.createElement('div');row.className='recipe-row';const b=document.createElement('button');b.className='recipe-title';b.textContent='📖 '+r.name;b.onclick=()=>openRecipe(r.id);row.append(b);box.append(row)});if(!recipes.some(r=>r.folder===activeFolder))box.insertAdjacentHTML('beforeend','<p>Geen recepten in deze map.</p>')}function openRecipe(id){const r=recipes.find(x=>String(x.id)===String(id));if(!r)return;$('recipeFolderView').classList.add('hidden');$('recipeDetail').classList.remove('hidden');$('recipeDetail').innerHTML='';const back=document.createElement('button');back.className='back';back.textContent='← Terug naar '+r.folder;back.onclick=renderRecipeFolder;$('recipeDetail').append(back);const card=document.createElement('div');card.className='card';card.innerHTML='<h2>'+esc(r.name)+'</h2><h4>🥕 Ingrediënten</h4><p>'+esc(r.ingredients)+'</p><h4>👨‍🍳 Bereiding</h4><p>'+esc(r.preparation)+'</p>';const edit=document.createElement('button');edit.className='secondary';edit.textContent='✏️ Aanpassen';edit.onclick=()=>openRecipeForm(r.id);const del=document.createElement('button');del.className='danger';del.textContent='🗑️ Verwijderen';del.onclick=()=>deleteRecipe(r.id);card.append(edit,del);$('recipeDetail').append(card)}function openRecipeForm(id){editId=id??null;$('recipeRoot').classList.add('hidden');$('recipeFolderView').classList.add('hidden');$('recipeDetail').classList.add('hidden');$('recipeForm').classList.remove('hidden');const r=id==null?null:recipes.find(x=>String(x.id)===String(id));$('recipeForm').innerHTML='<button class="back" id="formBack">← Terug</button><h1>➕ Recept</h1><label>Naam</label><input id="rName"><label>Map</label><select id="rFolder"></select><label>Aantal</label><input id="rAmount" type="number"><label>🥕 Ingrediënten</label><textarea id="rIngredients"></textarea><label>👨‍🍳 Bereiding</label><textarea id="rPreparation"></textarea><button class="primary" id="saveRecipe">💾 Opslaan</button>';folders.forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=f;$('rFolder').append(o)});$('rName').value=r?.name||'';$('rFolder').value=r?.folder||activeFolder||folders[0];$('rAmount').value=r?.amount||'';$('rIngredients').value=r?.ingredients||'';$('rPreparation').value=r?.preparation||'';$('formBack').onclick=()=>activeFolder?renderRecipeFolder():renderRecipeRoot;$('saveRecipe').onclick=saveRecipe}function saveRecipe(){const name=$('rName').value.trim();if(!name)return alert('Vul een receptnaam in.');const folder=folders.includes($('rFolder').value)?$('rFolder').value:folders[0];const r={id:editId??Date.now(),name,folder,amount:$('rAmount').value,unit:'persons',ingredients:$('rIngredients').value,preparation:$('rPreparation').value};recipes=editId==null?[...recipes,r]:recipes.map(x=>String(x.id)===String(editId)?r:x);persist();activeFolder=folder;editId=null;renderRecipeFolder()}function deleteRecipe(id){const r=recipes.find(x=>String(x.id)===String(id));if(!r||!confirm('Recept verwijderen?'))return;recipes=recipes.filter(x=>String(x.id)!==String(id));selected.delete(id);persist();renderRecipeFolder()}function addFolder(){const n=$('folderName').value.trim();if(!n)return;if(folders.includes(n))return alert('Deze map bestaat al.');folders.push(n);$('folderName').value='';persist();renderRecipeRoot()}function openShopFolder(folder){const box=$('shopSelect');box.innerHTML='';const head=document.createElement('div');head.className='folder-head';const back=document.createElement('button');back.className='back';back.textContent='← Terug naar mappen';back.onclick=renderShopFolders;const h=document.createElement('h1');h.textContent='📁 '+folder;head.append(back,h);box.append(head);recipes.filter(r=>r.folder===folder).forEach(r=>{const lab=document.createElement('label');lab.style.cssText='display:flex;gap:10px;align-items:center;margin:12px 0;background:#fbf6ee;padding:13px;border-radius:12px';const cb=document.createElement('input');cb.type='checkbox';cb.className='check';cb.checked=selected.has(r.id);cb.onchange=()=>{if(cb.checked)selected.add(r.id);else selected.delete(r.id);persist()};const span=document.createElement('span');span.textContent=r.name;lab.append(cb,span);box.append(lab)});if(!recipes.some(r=>r.folder===folder))box.insertAdjacentHTML('beforeend','<p>Geen recepten in deze map.</p>');const done=document.createElement('button');done.className='primary';done.textContent='✓ Klaar';done.onclick=renderShopFolders;box.append(done)}function renderShopFolders(){$('shoppingMain').classList.add('hidden');$('shoppingResult').classList.add('hidden');$('shopSelect').classList.remove('hidden');$('shopSelect').innerHTML='<div class="folder-head"><button class="back" id="shopBack">← Terug naar boodschappen</button><h1>📁 Selecteer recepten</h1></div><div id="shopFolders" class="folders"></div>';$('shopBack').onclick=showShoppingMain;folders.forEach(f=>{const b=document.createElement('button');b.className='folder';b.textContent='📁 '+f;b.onclick=()=>openShopFolder(f);$('shopFolders').append(b)})}function showShoppingMain(){$('shopSelect').classList.add('hidden');$('shoppingMain').classList.remove('hidden');$('shoppingResult').classList.add('hidden')}function buildShopping(){const chosen=recipes.filter(r=>selected.has(r.id));const box=$('shoppingResult');box.classList.remove('hidden');box.innerHTML='<h2>🛒 Boodschappenlijst</h2>';if(!chosen.length){box.insertAdjacentHTML('beforeend','<p>Je hebt nog geen recepten geselecteerd.</p>');return}chosen.forEach(r=>{const item=document.createElement('div');item.className='shopping-item';const text=document.createElement('span');text.textContent=r.ingredients||'';const del=document.createElement('button');del.className='remove-item';del.textContent='✕';del.title='Verwijder dit recept uit de boodschappenlijst';del.onclick=()=>{selected.delete(r.id);persist();buildShopping()};item.append(text,del);box.append(item)})}function clearShopping(){selected.clear();persist();$('shoppingResult').classList.add('hidden')}normalize();$('brand').onclick=e=>{e.preventDefault();show('home')};document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>show(b.dataset.show));$('calc').onclick=()=>{const t=parseFloat($('thickness').value);if(!t)return alert('Vul de dikte in.');const m=t<=2?60:t<=2.5?75:t<=3?90:t<=3.5?105:t<=4?120:t<=5?180:t<=6?210:270;$('temp').textContent=temps[$('doneness').value]+' °C';$('time').textContent=Math.floor(m/60)+' uur '+m%60+' min';$('svresult').classList.remove('hidden')};$('addFolder').onclick=addFolder;$('addRecipeRoot').onclick=()=>openRecipeForm(null);$('search').oninput=renderRecipeRoot;$('selectShopping').onclick=renderShopFolders;$('makeList').onclick=buildShopping;$('clearList').onclick=clearShopping;show('home');</script></body></html>
