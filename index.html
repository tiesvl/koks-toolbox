<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2342"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KOKS TOOLBOX"><title>KOKS TOOLBOX</title><link rel="icon" href="logo.svg?v=6"><link rel="apple-touch-icon" href="logo.svg?v=6"><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef4ff}body{min-height:100vh;background:linear-gradient(135deg,#07162b,#0b2342 48%,#102f54);background-attachment:fixed}.wrap{max-width:1100px;margin:auto;padding:18px 16px 42px}.brand{display:flex;align-items:center;justify-content:center;gap:12px;width:max-content;margin:0 auto 8px;text-decoration:none;color:#f3e5cf}.brand img{width:76px;height:44px;object-fit:contain}.brand span{font-family:Georgia,serif;font-size:24px;font-weight:900;letter-spacing:2px}.brand small{display:block;color:#dcb56f;font-size:10px;letter-spacing:3px}.home{position:relative;min-height:calc(100vh - 125px);display:flex;flex-direction:column;align-items:center;padding-top:3vh}.sub{margin:0 0 20px;color:#b9cae0}.menu{position:absolute;inset:0;pointer-events:none}.tool{position:absolute;padding:16px 20px;border:1px solid #7fa3c955;border-radius:18px;background:linear-gradient(145deg,#173b63,#0d2949);color:#f2f6fb;font-size:17px;font-weight:800;cursor:pointer;pointer-events:auto;box-shadow:0 12px 30px #0007}.tool.sous{left:8%;top:40%;width:36%;height:22%}.tool.shop{display:none}.back{background:#dcc8ad;color:#2b241d;border:0;border-radius:11px;padding:9px 12px;font-weight:800;margin-bottom:16px;cursor:pointer}section{max-width:760px;margin:auto;background:linear-gradient(145deg,#f2e7d7,#e7d6c0);color:#2d2924;border:1px solid #d4bfa5;border-radius:22px;padding:22px;box-shadow:0 14px 35px #00000038}section h1{color:#2d2924}section .sub{color:#756a5c}label{display:block;font-weight:700;margin:15px 0 7px;color:#3c342c}input,select,textarea{width:100%;padding:13px 14px;border:1px solid #cdbb9f;border-radius:12px;font-size:16px;background:#fbf6ee;color:#2d2924;font:inherit}textarea{min-height:150px;resize:vertical}.primary{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;font-size:17px;font-weight:800;background:#173b63;color:white;cursor:pointer}.hidden{display:none}.result{margin-top:20px;padding:18px;border-radius:16px;background:#e5d2b9}.big{font-size:31px;font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #cfbfa8}.qty{display:flex;align-items:center;gap:8px}.qty button{border:0;background:#ddc7a8;color:#2d2924;border-radius:10px;padding:8px 12px;font-size:16px;font-weight:800;cursor:pointer}@media(max-width:700px){.tool.sous{left:4%;width:92%}section{padding:18px}}</style></head><body><div class="wrap"><a class="brand" href="#" onclick="show('home');return false"><img src="logo.svg?v=6" alt="KOKS TOOLBOX logo"><div><span>KOKS</span><small>TOOLBOX</small></div></a><div id="home" class="home"><p class="sub">Praktische tools voor in de keuken.</p><div class="menu"><button class="tool sous" onclick="show('sousvide')">🥩 Sous-vide</button></div></div><section id="sousvide" class="hidden"><button class="back" onclick="show('home')">← Menu</button><h1>🥩 Sous-vide Calculator</h1><p class="sub">Vul je biefstuk in en krijg direct temperatuur en tijd.</p><label>Soort biefstuk</label><input id="type" placeholder="Bijv. ossenhaas, ribeye, picanha..."><label>Dikte (cm)</label><input id="thickness" type="number" min="0.5" step="0.1"><label>Gaarheid</label><select id="doneness"><option value="rare">Rare</option><option value="mr">Medium rare</option><option value="medium">Medium</option><option value="mw">Medium well</option><option value="well">Well done</option></select><button class="primary" onclick="calculate()">Bereken</button><div id="svresult" class="result hidden"><div class="big" id="temp"></div><div class="row"><span>⏱️ Tijd</span><strong id="time"></strong></div></div></section></div><script>function show(id){document.getElementById('home').classList.toggle('hidden',id!=='home');document.getElementById('sousvide').classList.toggle('hidden',id!=='sousvide');window.scrollTo(0,0)}const temps={rare:52,mr:54,medium:58,mw:62,well:66};function calculate(){let t=parseFloat(document.getElementById('thickness').value);if(!t)return alert('Vul de dikte in.');let min=t<=2?60:t<=2.5?75:t<=3?90:t<=3.5?105:t<=4?120:t<=5?180:t<=6?210:270;document.getElementById('temp').textContent=temps[document.getElementById('doneness').value]+' °C';document.getElementById('time').textContent=Math.floor(min/60)+' uur '+min%60+' min';document.getElementById('svresult').classList.remove('hidden')}</script></body></html>
