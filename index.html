<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOKS TOOLBOX</title><link rel="icon" href="logo.svg?v=6"><style>body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#07162b,#0b2342 48%,#102f54);color:#fff}.wrap{max-width:1100px;margin:auto;padding:18px 16px}.brand{text-align:center;color:#f3e5cf;margin-bottom:20px}.brand span{font:900 24px Georgia;letter-spacing:2px}.brand small{display:block;color:#dcb56f;font-size:10px;letter-spacing:3px}.home{min-height:75vh;display:flex;justify-content:center;padding-top:10vh}.menu{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}.tool{padding:30px 48px;border:1px solid #7fa3c955;border-radius:18px;background:linear-gradient(145deg,#173b63,#0d2949);color:#fff;font-size:18px;font-weight:800;cursor:pointer}.hidden{display:none!important}section{max-width:900px;margin:auto;background:linear-gradient(145deg,#f2e7d7,#e7d6c0);color:#2d2924;border-radius:22px;padding:22px}.back,.secondary,.primary,.danger{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.back,.secondary{background:#ddc7a8;color:#2d2924}.primary{background:#173b63;color:#fff}.danger{background:#a83c32;color:#fff}.folders{display:flex;flex-direction:column;gap:8px}.folder,.recipe-title{width:100%;display:block;text-align:left;border:1px solid #cdbb9f;border-radius:13px;background:#fbf6ee;color:#2d2924;padding:14px;font-weight:800;font-size:16px}.recipe-row{display:flex;gap:8px;align-items:center;margin-top:9px}.recipe-row .recipe-title{margin:0;flex:1}.check{width:22px;height:22px;accent-color:#173b63}.card{padding:16px;border-radius:16px;background:#e5d2b9;margin-top:12px}.card p{white-space:pre-wrap}.crumb{color:#756a5c;font-size:14px}.folder-head{display:flex;align-items:center;gap:12px;margin-bottom:15px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select,textarea{width:100%;padding:12px;border:1px solid #cdbb9f;border-radius:11px;background:#fbf6ee;color:#2d2924;font:inherit}.actions input{width:auto;flex:1}.form-actions{display:flex;gap:8px;margin-top:14px}@media(max-width:700px){.tool{width:90vw}}</style></head><body><div class="wrap"><a class="brand" href="#" onclick="show('home');return false"><span>KOKS</span><small>TOOLBOX</small></a><div id="home" class="home"><div class="menu"><button class="tool" onclick="show('sousvide')">🥩 Sous-vide</button><button class="tool" onclick="show('recipes')">📖 Mijn recepten</button><button class="tool" onclick="show('shopping')">🛒 Boodschappen</button></div></div><section id="sousvide" class="hidden"><button class="back" onclick="show('home')">← Menu</button><h1>🥩 Sous-vide Calculator</h1><label>Soort biefstuk</label><input id="type" placeholder="Bijv. ribeye"><label>Dikte (cm)</label><input id="thickness" type="number" min="0.5" step="0.1"><label>Gaarheid</label><select id="doneness"><option value="rare">Rare</option><option value="mr">Medium rare</option><option value="medium">Medium</option><option value="mw">Medium well</option><option value="well">Well done</option></select><button class="primary" onclick="calculate()">Bereken</button><div id="svresult" class="card hidden"><b id="temp"></b><div id="time"></div></div></section><section id="recipes" class="hidden"><button class="back" onclick="show('home')">← Menu</button><div id="root"><div class="actions"><input id="folderName" placeholder="Nieuwe map"><button class="secondary" onclick="addFolder()">➕ Map</button><button class="primary" onclick="newRecipe()">➕ Recept</button></div><input id="search" placeholder="Zoeken..." oninput="renderRoot"><div id="folders" class="folders"></div></div><div id="folderView" class="hidden"></div><div id="recipeDetail" class="hidden"></div><div id="form" class="hidden"></div></section><section id="shopping" class="hidden"><button class="back" onclick="show('home')">← Menu</button><h1>🛒 Boodschappen</h1><button class="primary" onclick="startShopSelect()">☑️ Selecteer recepten</button><div id="shoppingMain" class="card"><p>Maak hier je boodschappenlijst op basis van de geselecteerde recepten.</p><button class="primary" onclick="buildShopping()">🛒 Maak boodschappenlijst</button><button class="secondary" onclick="clearShopping()">Wissen</button></div><div id="shopSelect" class="hidden"></div><div id="shoppingResult" class="card hidden"></div></section></div><script>const temps={rare:52,mr:55,medium:58,mw:62,well:66};let recipes=JSON.parse(localStorage.getItem('recipes')||'[]'),folders=JSON.parse(localStorage.getItem('folders')||'["Algemeen"]'),selected=new Set(JSON.parse(localStorage.getItem('shoppingRecipes')||'[]')),active=null,edit=null;const $=x=>document.getElementById(x);function saveData(){localStorage.setItem('recipes',JSON.stringify(recipes));localStorage.setItem('folders',JSON.stringify(folders));localStorage.setItem('shoppingRecipes',JSON.stringify([...selected]))}function show(id){['home','sousvide','recipes','shopping'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='recipes')renderRoot();if(id==='shopping')showShoppingMain();scrollTo(0,0)}function calculate(){let t=parseFloat($('thickness').value);if(!t)return alert('Vul de dikte in.');let m=t<=2?60:t<=2.5?75:t<=3?90:t<=3.5?105:t<=4?120:t<=5?180:t<=6?210:270;$('temp').textContent=temps[$('doneness').value]+' °C';$('time').textContent=Math.floor(m/60)+' uur '+m%60+' min';$('svresult').classList.remove('hidden')}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function opts(v){return folders.map(f=>'<option '+(f===v?'selected':'')+'>'+esc(f)+'</option>').join('')}function renderRoot(){active=null;$('root').classList.remove('hidden');$('folderView').classList.add('hidden');$('recipeDetail').classList.add('hidden');$('form').classList.add('hidden');let q=($('search').value||'').toLowerCase();$('folders').innerHTML=folders.filter(f=>!q||f.toLowerCase().includes(q)).map(f=>'<button class="folder" onclick="openFolder('+JSON.stringify(f)+')">📁 '+esc(f)+'</button>').join('')||'<p>Geen mappen.</p>'}function openFolder(f){active=f;$('root').classList.add('hidden');$('folderView').classList.remove('hidden');renderFolder()}function renderFolder(){let rs=recipes.filter(r=>r.folder===active);$('folderView').innerHTML='<div class="folder-head"><button class="back" onclick="renderRoot()">← Terug naar mappen</button><h1>📁 '+esc(active)+'</h1></div><div class="actions"><button class="primary" onclick="newRecipe()">➕ Recept</button></div>'+(rs.map(r=>'<div class="recipe-row"><button class="recipe-title" onclick="openRecipe('+r.id+')">📖 '+esc(r.name)+'</button></div>').join('')||'<p>Geen recepten in deze map.</p>')}function openRecipe(id){let r=recipes.find(x=>x.id===id);$('folderView').classList.add('hidden');$('recipeDetail').classList.remove('hidden');$('recipeDetail').innerHTML='<button class="back" onclick="renderFolder()">← Terug naar '+esc(r.folder)+'</button><div class="card"><h2>'+esc(r.name)+'</h2><h4>🥕 Ingrediënten</h4><p>'+esc(r.ingredients)+'</p><h4>👨‍🍳 Bereiding</h4><p>'+esc(r.preparation)+'</p><button class="secondary" onclick="editRecipe('+id+')">✏️ Aanpassen</button><button class="danger" onclick="removeRecipe('+id+')">🗑️ Verwijderen</button></div>'}function newRecipe(){edit=null;$('root').classList.add('hidden');$('folderView').classList.add('hidden');$('recipeDetail').classList.add('hidden');$('form').classList.remove('hidden');$('form').innerHTML='<h1>➕ Recept</h1><label>Naam</label><input id="name"><label>Map</label><select id="recipeFolder">'+opts(active||folders[0])+'</select><label>Personen / gram</label><input id="amount" type="number"><label>🥕 Ingrediënten</label><textarea id="ingredients"></textarea><label>👨‍🍳 Bereiding</label><textarea id="preparation"></textarea><button class="primary" onclick="saveRecipe()">Opslaan</button>'}function editRecipe(id){let r=recipes.find(x=>x.id===id);newRecipe();edit=id;$('name').value=r.name;$('recipeFolder').value=r.folder;$('amount').value=r.amount;$('ingredients').value=r.ingredients;$('preparation').value=r.preparation}function saveRecipe(){let r={id:edit||Date.now(),name:$('name').value.trim(),folder:$('recipeFolder').value,amount:$('amount').value,unit:'persons',ingredients:$('ingredients').value,preparation:$('preparation').value};if(!r.name)return;recipes=edit?recipes.map(x=>x.id===edit?r:x):[...recipes,r];saveData();edit=null;active=r.folder;$('form').classList.add('hidden');$('folderView').classList.remove('hidden');renderFolder()}function removeRecipe(id){if(!confirm('Dit recept verwijderen?'))return;recipes=recipes.filter(r=>r.id!==id);selected.delete(id);saveData();renderFolder()}function addFolder(){let n=prompt('Naam van de nieuwe map:');if(!n||folders.includes(n.trim()))return;folders.push(n.trim());saveData();renderRoot()}function startShopSelect(){$('shoppingMain').classList.add('hidden');$('shoppingResult').classList.add('hidden');$('shopSelect').classList.remove('hidden');renderShopFolders()}function renderShopFolders(){let html='<div class="folder-head"><button class="back" onclick="showShoppingMain()">← Terug naar boodschappen</button><h1>📁 Selecteer recepten</h1></div><div class="folders">'+folders.map(f=>'<button class="folder" onclick="shopOpenFolder('+JSON.stringify(f)+')">📁 '+esc(f)+'</button>').join('')+'</div>';$('shopSelect').innerHTML=html}function shopOpenFolder(f){let rs=recipes.filter(r=>r.folder===f);$('shopSelect').innerHTML='<div class="folder-head"><button class="back" onclick="renderShopFolders()">← Terug naar mappen</button><h1>📁 '+esc(f)+'</h1></div>'+ (rs.map(r=>'<label style="display:flex;gap:10px;align-items:center;margin:12px 0;background:#fbf6ee;padding:13px;border-radius:12px"><input class="check" type="checkbox" '+(selected.has(r.id)?'checked':'')+' onchange="toggleShop('+r.id+',this.checked)"><span>'+esc(r.name)+'</span></label>').join('')||'<p>Geen recepten in deze map.</p>')+'<button class="primary" onclick="renderShopFolders()">✓ Klaar</button>'}function toggleShop(id,on){if(on)selected.add(id);else selected.delete(id);saveData()}function showShoppingMain(){$('shopSelect').classList.add('hidden');$('shoppingMain').classList.remove('hidden');$('shoppingResult').classList.add('hidden')}function buildShopping(){let chosen=recipes.filter(r=>selected.has(r.id));let lines=chosen.map(r=>r.ingredients.trim()?r.ingredients.trim():'').filter(Boolean);$('shoppingResult').innerHTML='<h2>🛒 Boodschappenlijst</h2>'+(lines.length?'<p>'+esc(lines.join('\n\n'))+'</p>':'<p>Je hebt nog geen recepten geselecteerd.</p>');$('shoppingResult').classList.remove('hidden')}function clearShopping(){selected.clear();saveData();$('shoppingResult').classList.add('hidden')}</script></body></html>
