<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2342"><meta name="apple-mobile-web-app-capable" content="yes"><title>KOKS TOOLBOX</title><link rel="icon" href="logo.svg?v=6"><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef4ff}body{background:linear-gradient(135deg,#07162b,#0b2342 48%,#102f54);background-attachment:fixed}.wrap{max-width:1100px;margin:auto;padding:18px 16px 42px}.brand{display:flex;align-items:center;justify-content:center;gap:12px;width:max-content;margin:0 auto 8px;text-decoration:none;color:#f3e5cf}.brand img{width:76px;height:44px;object-fit:contain}.brand span{font-family:Georgia,serif;font-size:24px;font-weight:900;letter-spacing:2px}.brand small{display:block;color:#dcb56f;font-size:10px;letter-spacing:3px}.home{min-height:calc(100vh - 125px);display:flex;justify-content:center;padding-top:12vh}.menu{display:flex;gap:24px}.tool{padding:30px 60px;border:1px solid #7fa3c955;border-radius:18px;background:linear-gradient(145deg,#173b63,#0d2949);color:#f2f6fb;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 12px 30px #0007}.back{background:#dcc8ad;color:#2b241d;border:0;border-radius:11px;padding:9px 12px;font-weight:800;margin-bottom:16px;cursor:pointer}section{max-width:900px;margin:auto;background:linear-gradient(145deg,#f2e7d7,#e7d6c0);color:#2d2924;border:1px solid #d4bfa5;border-radius:22px;padding:22px;box-shadow:0 14px 35px #00000038}h1{color:#2d2924}label{display:block;font-weight:700;margin:15px 0 7px}input,select,textarea{width:100%;padding:13px 14px;border:1px solid #cdbb9f;border-radius:12px;font-size:16px;background:#fbf6ee;color:#2d2924;font:inherit}textarea{min-height:130px;resize:vertical}.primary,.secondary{padding:12px 16px;border:0;border-radius:12px;font-weight:800;cursor:pointer}.primary{background:#173b63;color:white}.secondary{background:#ddc7a8;color:#2d2924}.danger{background:#a83c32;color:#fff}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.actions,.folders{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.folder{padding:9px 13px;border-radius:12px;border:1px solid #cdbb9f;background:#fbf6ee;color:#2d2924;font-weight:800;cursor:pointer}.folder.active{background:#173b63;color:#fff}.card{padding:16px;border-radius:16px;background:#e5d2b9;margin-top:12px}.card p{white-space:pre-wrap}.meta{color:#756a5c;font-size:14px}@media(max-width:700px){.menu{flex-direction:column}.tool{width:90vw;padding:25px}.home{padding-top:6vh}section{padding:18px}}</style></head><body><div class="wrap"><a class="brand" href="#" onclick="show('home');return false"><img src="logo.svg?v=6"><div><span>KOKS</span><small>TOOLBOX</small></div></a><div id="home" class="home"><div class="menu"><button class="tool" onclick="show('sousvide')">🥩 Sous-vide</button><button class="tool" onclick="show('recipes')">📖 Mijn recepten</button></div></div><section id="sousvide" class="hidden"><button class="back" onclick="show('home')">← Menu</button><h1>🥩 Sous-vide Calculator</h1><label>Soort biefstuk</label><input id="type" placeholder="Bijv. ribeye"><label>Dikte (cm)</label><input id="thickness" type="number" min="0.5" step="0.1"><label>Gaarheid</label><select id="doneness"><option value="rare">Rare</option><option value="mr">Medium rare</option><option value="medium">Medium</option><option value="mw">Medium well</option><option value="well">Well done</option></select><button class="primary" onclick="calculate()">Bereken</button><div id="svresult" class="card hidden"><b id="temp"></b><div id="time"></div></div></section><section id="recipes" class="hidden"><button class="back" onclick="show('home')">← Menu</button><div class="top"><h1>📖 Mijn recepten</h1><button class="primary" onclick="newRecipe()">➕ Toevoegen</button></div><input id="search" placeholder="Zoeken..." oninput="render()"><div class="actions"><input id="folderName" placeholder="Nieuwe map"><button class="secondary" onclick="addFolder()">➕ Map toevoegen</button><button class="secondary danger" onclick="deleteFolder()">🗑️ Map verwijderen</button></div><div id="folders" class="folders"></div><div id="form" class="hidden"><label>Receptnaam</label><input id="name"><label>Gebruik</label><select id="unit" onchange="labelUnit()"><option value="persons">👥 Personen</option><option value="grams">⚖️ Gram</option></select><label id="amountLabel">Aantal personen</label><input id="amount" type="number" min="1"><label>🥕 Ingrediënten</label><textarea id="ingredients"></textarea><label>👨‍🍳 Bereiding</label><textarea id="preparation"></textarea><div class="actions"><button class="primary" onclick="save()">➕ Toevoegen</button><button class="secondary danger" onclick="cancel()">🗑️ Verwijderen</button></div></div><div id="list"></div></section></div><script>const temps={rare:52,mr:54,medium:58,mw:62,well:66};let recipes=JSON.parse(localStorage.getItem('recipes')||'[]'),folders=JSON.parse(localStorage.getItem('folders')||'["Algemeen"]'),active=folders[0],edit=null;const $=id=>document.getElementById(id);function show(id){['home','sousvide','recipes'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='recipes')render();scrollTo(0,0)}function calculate(){let t=parseFloat($('thickness').value);if(!t)return alert('Vul de dikte in.');let m=t<=2?60:t<=2.5?75:t<=3?90:t<=3.5?105:t<=4?120:t<=5?180:t<=6?210:270;$('temp').textContent=temps[$('doneness').value]+' °C';$('time').textContent=Math.floor(m/60)+' uur '+m%60+' min';$('svresult').classList.remove('hidden')}function persist(){localStorage.setItem('recipes',JSON.stringify(recipes));localStorage.setItem('folders',JSON.stringify(folders))}function render(){if(!folders.includes(active))active=folders[0];$('folders').innerHTML=folders.map(f=>'<button class="folder '+(f===active?'active':'')+'" onclick="active='+JSON.stringify(f)+';render()">📁 '+esc(f)+'</button>').join('');let q=$('search').value.toLowerCase();let a=recipes.filter(r=>r.folder===active&&(!q||r.name.toLowerCase().includes(q)));$('list').innerHTML=a.map(r=>'<div class="card"><h3>'+esc(r.name)+'</h3><div class="meta">'+(r.unit==='grams'?'⚖️ '+r.amount+' gram':'👥 '+r.amount+' personen')+'</div><h4>🥕 Ingrediënten</h4><p>'+esc(r.ingredients)+'</p><h4>👨‍🍳 Bereiding</h4><p>'+esc(r.preparation)+'</p><div class="actions"><button class="secondary" onclick="editRecipe('+JSON.stringify(r.id)+')">✏️ Aanpassen</button><button class="secondary danger" onclick="removeRecipe('+JSON.stringify(r.id)+')">🗑️ Verwijderen</button></div></div>').join('')||'<p>Geen recepten in deze map.</p>'}function newRecipe(){edit=null;$('form').classList.remove('hidden');['name','amount','ingredients','preparation'].forEach(x=>$(x).value='');$('unit').value='persons';labelUnit()}function editRecipe(id){let r=recipes.find(x=>x.id===id);if(!r)return;edit=id;$('form').classList.remove('hidden');$('name').value=r.name;$('unit').value=r.unit;$('amount').value=r.amount;$('ingredients').value=r.ingredients;$('preparation').value=r.preparation;labelUnit()}function labelUnit(){$('amountLabel').textContent=$('unit').value==='grams'?'Hoeveel gram':'Aantal personen'}function save(){let name=$('name').value.trim();if(!name)return alert('Vul een receptnaam in.');let r={id:edit||Date.now(),name,unit:$('unit').value,amount:$('amount').value,ingredients:$('ingredients').value,preparation:$('preparation').value,folder:active};recipes=edit?recipes.map(x=>x.id===edit?r:x):[...recipes,r];persist();cancel();render()}function cancel(){edit=null;$('form').classList.add('hidden')}function removeRecipe(id){if(confirm('Recept verwijderen?')){recipes=recipes.filter(r=>r.id!==id);persist();render()}}function addFolder(){let n=$('folderName').value.trim();if(!n||folders.includes(n))return;folders.push(n);active=n;$('folderName').value='';persist();render()}function deleteFolder(){if(folders.length===1)return alert('Er moet minimaal één map blijven.');if(confirm('Map en de recepten erin verwijderen?')){recipes=recipes.filter(r=>r.folder!==active);folders=folders.filter(f=>f!==active);active=folders[0];persist();render()}}function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}</script></body></html>
